<!DOCTYPE html>
<html>

<head>

    <title>Main IDS Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/static/css/style.css">
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="dashboard-body">

<div class="container py-4">

    <h1 class="text-center mb-4">
        Main IDS Dashboard
    </h1>

    <div class="row">

        <!-- Prediction Panel -->
        <div class="col-lg-6">

            <div class="glass-card">

                <h3>
                    Threat Detection
                </h3>

                <label class="mt-3">
                    Source IP
                </label>

                <input
                    type="text"
                    id="ip"
                    class="form-control"
                    placeholder="192.168.1.100"
                >

                <label class="mt-3">
                    78 Features (comma separated)
                </label>

                <textarea
                    id="features"
                    class="form-control"
                    rows="8"
                    placeholder="80,7744936,8,6,..."
                ></textarea>

                <button
                    class="btn btn-primary mt-3 w-100"
                    onclick="predictIDS()"
                >
                    DETECT THREAT
                </button>

            </div>

        </div>

        <!-- Result Panel -->
        <div class="col-lg-6">

            <div class="glass-card">

                <h3>
                    Prediction Result
                </h3>

                <div id="result">

                    No prediction yet.

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Visualization Section -->

<div class="row mt-4">

    <div class="col-md-3">

        <div class="glass-card">

            <h4>Threat Level</h4>

            <h2 id="threatLevel">
                LOW
            </h2>

        </div>

    </div>

    <div class="col-md-9">

        <div class="glass-card">

            <h4>
                Attack Distribution
            </h4>

            <canvas id="attackChart"></canvas>

        </div>

    </div>

</div>

<div class="row mt-4">

    <div class="col-md-6">

        <div class="glass-card">

            <h4>
                Blockchain Timeline
            </h4>

            <div id="timeline">

                Loading...

            </div>

        </div>

    </div>

    <div class="col-md-6">

        <div class="glass-card">

            <h4>
                Blacklisted IPs
            </h4>

            <div id="blacklist">

                Loading...

            </div>

        </div>

    </div>

</div>

<script src="/static/js/script.js"></script>

</body>
</html>
