<!DOCTYPE html>
<html>

<head>

    <title>MEC Node 1</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body class="dashboard-body">

<div class="container py-4">

    <h1 class="text-center mb-4">
        MEC Node 1
    </h1>

    <div class="row">

        <div class="col-md-6">

            <div class="glass-card">

                <h3>
                    Predict Traffic
                </h3>

                <input
                    id="ip"
                    class="form-control mb-3"
                    placeholder="Source IP"
                >

                <textarea
                    id="features"
                    class="form-control"
                    rows="8"
                    placeholder="78 comma separated features"
                ></textarea>

                <button
                    class="btn btn-primary mt-3 w-100"
                    onclick="predictMEC1()"
                >
                    Detect
                </button>

            </div>

        </div>

        <div class="col-md-6">

            <div class="glass-card">

                <h3>
                    Result
                </h3>

                <div id="result">

                    No prediction yet

                </div>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-3">

            <div class="glass-card">

                <h4>Status</h4>

                <h2 id="status">

                    ACTIVE

                </h2>

            </div>

        </div>

        <div class="col-md-9">

            <div class="glass-card">

                <h4>
                    Traffic Distribution
                </h4>

                <canvas
                    id="mecChart"
                ></canvas>

            </div>

        </div>

    </div>

    <div class="glass-card mt-4">

        <h4>
            Recent Predictions
        </h4>

        <div id="history">

            Loading...

        </div>

    </div>

</div>

<script src="/static/js/mec1.js"></script>

</body>
</html>
