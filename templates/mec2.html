<!DOCTYPE html>
<html>

<head>

    <title>MEC Node 2</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body class="dashboard-body">

<div class="container py-4">

    <h1 class="text-center mb-4">

        MEC Node 2

    </h1>

    <div class="row">

        <div class="col-md-6">

            <div class="glass-card">

                <h3>

                    Collaborative Detection

                </h3>

                <input
                    id="ip"
                    class="form-control mb-3"
                    placeholder="Source IP"
                >

                <textarea
                    id="features"
                    rows="8"
                    class="form-control"
                    placeholder="78 Features"
                ></textarea>

                <button
                    class="btn btn-primary mt-3 w-100"
                    onclick="predictMEC2()"
                >

                    Check Threat

                </button>

            </div>

        </div>

        <div class="col-md-6">

            <div class="glass-card">

                <h3>

                    Result

                </h3>

                <div id="result">

                    Awaiting request

                </div>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-4">

            <div class="glass-card">

                <h4>

                    Sync Status

                </h4>

                <h2 id="status">

                    CONNECTED

                </h2>

            </div>

        </div>

        <div class="col-md-8">

            <div class="glass-card">

                <h4>

                    Shared Threat Intelligence

                </h4>

                <div id="shared">

                    Loading...

                </div>

            </div>

        </div>

    </div>

    <div class="glass-card mt-4">

        <h4>

            Blocked Requests

        </h4>

        <div id="blocked">

            Loading...

        </div>

    </div>

</div>

<script src="/static/js/mec2.js"></script>

</body>

</html>
